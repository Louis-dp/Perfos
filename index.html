.brand b{font-size:19px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--bar-muted)}
.ac{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:4px 4px 4px 12px}
.ac{padding:4px 6px}
.acf{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:9px}
.acf+.acf{border-left:1px solid rgba(255,255,255,.12)}
.acf label{font-size:11px;color:var(--bar-muted);text-transform:uppercase;letter-spacing:.07em;line-height:1.1;max-width:70px}
.acf input{width:78px;background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:8px;color:var(--bar-ink);font:inherit;font-weight:700;font-size:17px;text-align:right;padding:7px 8px;outline:none}
.acf input:focus,.acf input.kp-on{border-color:var(--accent)}
.acf em{font-style:normal;font-size:12px;color:var(--bar-muted)}
.acf.miss input{border-color:var(--ko)}
#appcard .f label{font-size:13.5px}
#appcard .box{min-height:58px}
#appcard .box input{font-size:24px}
#appcard .box.miss{border-color:var(--ko)}
.ac select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--bar-ink);font-weight:700;font-size:16px;padding:8px 26px 8px 4px;min-width:120px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.ac select option{color:#000}
.ac button{appearance:none;border:0;background:rgba(255,255,255,.12);color:var(--bar-ink);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.tabs{margin-left:auto;display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--bar-muted);font-weight:650;font-size:15px;padding:10px 18px;border-radius:9px;cursor:pointer;min-height:42px}
.tabs button[aria-selected="true"]{background:var(--bar-ink);color:var(--bar)}
@media (max-width:1000px){header .tabs{flex:1 1 100%;margin-left:0}header .tabs button{flex:1}}
/* iPhone : barre non collante et compacte (elle prenait un quart de l'écran), sans la marge ajoutée pour l'iPad */
@media (max-width:600px){
  header{position:static;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
  html.standalone header{padding-top:calc(env(safe-area-inset-top) + 8px)}
  .bar{gap:8px}
  .brand b{font-size:17px}
  .tabs button{font-size:13px;padding:7px 4px;min-height:40px;line-height:1.15}
}
/* champs texte en 16 px sur écran tactile : en dessous, Safari iPhone zoome toute la page à la saisie */
@media (pointer:coarse){.ld .nm input{font-size:16px}}

/* ---------- grille ---------- */
main{max-width:1240px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1060px){main{grid-template-columns:340px minmax(0,1fr)}.ld{grid-template-columns:minmax(0,1fr) 92px 64px 22px;gap:6px}.ld .box input{font-size:16px}}
@media (max-width:780px){main{grid-template-columns:1fr}}
@media (max-width:600px){main{padding:12px 12px calc(20px + env(safe-area-inset-bottom));gap:12px}.ld{grid-template-columns:minmax(0,1fr) 96px 62px 22px}}
.card{background:var(--card,var(--surface));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card>h2{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.card>h2 .act{font-size:13px;letter-spacing:0;text-transform:none}

/* ---------- saisie ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.grid4{grid-template-columns:1fr 1fr}}
.chain{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:14.5px}
.chain b{text-align:right;font-variant-numeric:tabular-nums}
.chain .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
.chain .mu{color:var(--muted)}
.f label{display:block;font-size:12px;font-weight:650;color:var(--ink2);margin:0 0 4px 2px}
.box{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:11px;min-height:48px}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.box input{appearance:none;border:0;background:transparent;font-size:20px;font-weight:650;width:100%;min-width:0;padding:10px 4px 10px 12px;text-align:right}
.box input:focus{outline:none}
.box em{font-style:normal;color:var(--muted);font-size:13px;padding:0 12px 0 4px;white-space:nowrap}
.sel{appearance:none;-webkit-appearance:none;width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--field);padding:10px 12px;font-size:15px}
.derived{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.chip b{font-size:15px;color:var(--ink)}

/* chargement */
.ld{display:grid;grid-template-columns:minmax(0,1fr) 104px 78px 28px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ld.head{border-top:0;padding:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ld .nm{font-size:14px;font-weight:600;line-height:1.2}
.ld .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.ld .nm input{appearance:none;border:0;border-bottom:1px dashed var(--line);background:transparent;width:100%;font-size:14px;font-weight:600;padding:3px 0}
.ld .nm input:focus{outline:none;border-bottom-color:var(--accent)}
.ld .box{min-height:42px;border-radius:10px}
.ld .box input{font-size:17px;padding:8px 2px 8px 8px}
.ld .box em{padding:0 8px 0 2px;font-size:12px}
.ld .arm{font-size:14px;color:var(--ink2);text-align:right;padding-right:6px}
.x{appearance:none;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px}
.addline{margin-top:8px;width:100%}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;margin-top:10px;padding-top:12px;border-top:2px solid var(--line)}
.tot .k{font-size:14px;color:var(--ink2);font-weight:600}
.tot .v{font-size:26px;font-weight:750;text-align:right}
.tot .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
.tot .v2{font-size:18px;font-weight:700;text-align:right}
.envwrap{margin-top:12px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px}
.envwrap svg{display:block;width:100%;height:auto}

/* optionnels */
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--field);user-select:none;position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;background:var(--surface)}
.opt .ck svg{opacity:0}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .ck{background:var(--accent);border-color:var(--accent)}
.opt.on .ck svg{opacity:1}
.opt .t{font-size:14.5px;font-weight:650;line-height:1.25}
.opt .t span{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:6px}
.opt .e{font-size:12.5px;color:var(--ink2);margin-top:2px}
.neutral{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.neutral .lab{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:8px}
.neutral .row{display:flex;flex-wrap:wrap;gap:6px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:650;font-size:14px;cursor:pointer;min-height:42px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border-style:dashed}
.btn.danger{color:var(--ko)}
.link{appearance:none;border:0;background:none;color:var(--accent);font-weight:650;cursor:pointer;padding:0}

/* ---------- résultats ---------- */
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 2px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:18px}
.tiles.big{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{background:var(--card,var(--surface));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 14px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.tile.ok::before{background:var(--ok)} .tile.ko::before{background:var(--ko)} .tile.wn::before{background:var(--warn)}
.tile .tl{font-size:14px;font-weight:700;line-height:1.25}
.tile .tv{font-size:32px;font-weight:760;letter-spacing:-.5px;line-height:1.05}
.tile.big .tv{font-size:40px}
.tile .tv small{font-size:15px;color:var(--muted);font-weight:650;margin-left:4px;letter-spacing:0}
.tile .tr{font-size:12px;color:var(--muted);line-height:1.35;margin-top:auto}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ko{background:var(--ko-soft);color:var(--ko)} .pill.wn{background:var(--warn-soft);color:var(--warn)} .pill.na{background:var(--sunk);color:var(--muted)}
.hv{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:center}
@media (max-width:1000px){.hv{grid-template-columns:1fr}}
.hv svg{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline}
.kv span{color:var(--ink2);font-size:14px}
.kv b{font-size:20px;font-weight:720;text-align:right}
.alerts{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:550}
.alerts li.ko{background:var(--ko-soft);color:var(--ko)}
.alerts li.in{background:var(--accent-soft);color:var(--accent)}
.alerts li::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--warn);color:var(--warn-soft);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.alerts li.ko::before{background:var(--ko);color:var(--ko-soft)}
.alerts li.in::before{content:"i";background:var(--accent);color:var(--accent-soft)}
.pens{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px}
.pens span{font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-weight:650}
.empty{color:var(--muted);font-size:15px;padding:30px 10px;text-align:center}

/* ---------- flotte ---------- */
dialog[open]{display:flex;flex-direction:column}
dialog{border:0;border-radius:20px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 40px);overflow:hidden;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,12,20,.55)}
.dh{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);z-index:2}
.dh h3{margin:0;font-size:18px;flex:1}
.dh h3 small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.3}
.db{padding:16px 18px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.ac-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--sunk)}
.ac-card .grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
@media (max-width:600px){.ac-card .grid3{grid-template-columns:1fr 1fr}}
.ac-card .box input{font-size:17px}
.ac-card .tx{text-align:left}
.ac-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ac-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line)}
.theme{display:flex;gap:6px}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.verdict .vh{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.verdict .vr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.verdict .vr:first-child{border-top:0}
.verdict .vr span{font-weight:650;font-size:15px}
.verdict .vr b{font-size:16px;font-weight:800;padding:5px 12px;border-radius:9px;text-align:center;min-width:76px}
.verdict .vr b.ca{background:var(--ok-soft);color:var(--ok)}
.verdict .vr b.cb{background:var(--warn-soft);color:var(--warn)}
.verdict .vr small{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.verdict .vn{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.tile.na .tv{color:var(--muted)}
.grp{margin-top:10px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 0 4px;border-top:1px solid var(--line)}
.addbtn{white-space:nowrap;appearance:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;border-radius:999px;padding:7px 12px;cursor:pointer}
.none{font-size:13px;color:var(--muted);padding:4px 0 8px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto 76px 24px;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.it:first-child{border-top:0}
.it .nm{font-size:13.5px;font-weight:650;line-height:1.25}
.it .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.sg{display:inline-flex;margin-top:5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sg button{appearance:none;border:0;background:var(--field);font-size:11.5px;font-weight:650;padding:3px 8px;cursor:pointer;color:var(--ink2)}
.sg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.qty button{appearance:none;border:0;background:transparent;width:30px;height:34px;font-size:18px;font-weight:700;color:var(--accent);cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:700}
.kgv{text-align:right;font-weight:700;font-size:15px}
.kgv small{font-size:11px;color:var(--muted);margin-left:2px}
.ctgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ct{appearance:none;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 12px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;min-height:64px}
.ct b{font-size:13.5px;font-weight:650;line-height:1.25;padding-right:34px}
.ct span{font-size:12px;color:var(--muted)}
.ct i{position:absolute;top:8px;right:8px;font-style:normal;font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 7px}
.ct.on{border-color:var(--accent);background:var(--accent-soft)}
.ghostc{border-style:dashed;color:var(--muted);cursor:default}
.opt.sm{margin-top:8px;padding:9px 12px}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none}
#kp.on{display:block}
#kp .kh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto 8px;font-size:13px;color:var(--muted)}
#kp .kh b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
#kp .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
#kp button{appearance:none;border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:24px;font-weight:650;border-radius:12px;min-height:56px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#kp button:active{background:var(--accent-soft)}
#kp button.fn{font-size:16px;color:var(--ink2)}
#kp button.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:18px}
input.kp-on{caret-color:transparent}

body{isolation:isolate}
[hidden]{display:none!important}
.tile[data-chart]{cursor:pointer;transition:transform .08s,box-shadow .15s}
.tile[data-chart]:active{transform:scale(.985)}
.tile[data-chart]:hover{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.tile[data-chart] .tl{padding-right:74px}
.tile .see{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px}
.card.hvcard[data-chart]{cursor:pointer}
#chart{width:min(1100px,calc(100vw - 16px))}
#chart .db{padding:12px}
.chartcap{font-size:14px;color:var(--ink2);margin:0 0 10px;line-height:1.45}
.chartcap b{color:var(--ink)}
.envbig{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface)}
.envbig svg{display:block;width:100%;height:auto;max-height:calc(100dvh - 200px)}
#env{cursor:zoom-in}
.chartbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;background:#fff}
.chartbox svg{display:block;margin:0 auto;width:auto!important;max-width:100%;max-height:calc(100dvh - 190px)}
.noac{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--ko);border-radius:12px;color:var(--ko);font-weight:600;font-size:14px;margin-bottom:6px}
.vide{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:8px 0 10px}
.vide .nm{font-size:14px;font-weight:600}.vide .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.vide b{font-size:18px;text-align:right}.vide b small{font-size:12px;color:var(--muted);margin-left:3px}
@media print{header .tabs,.ac button,.x,.addline,.btn{display:none}html,body{background:#fff}main{display:block}.card,.tile{box-shadow:none;break-inside:avoid}}
</style>

<body>
<header>
  <div class="bar">
    <div class="brand"><b>Grizzlys</b><span>AS332M1e / AS532 UL</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="n" aria-selected="true">Performances normales</button>
      <button role="tab" data-tab="p" aria-selected="false">Performances pannes</button>
      <button role="tab" data-tab="m" aria-selected="false">Simulation</button>
    </div>
  </div>
</header>

<main>
  <aside>
    <section class="card" id="appcard">
      <h2>Appareil</h2>
      <div class="grid2 big2">
        <div class="f"><label for="mv">Masse à vide</label><div class="box"><input id="mv" inputmode="decimal" placeholder="—"><em>kg</em></div></div>
        <div class="f"><label for="cgv">Centrage à vide</label><div class="box"><input id="cgv" inputmode="decimal" placeholder="—"><em>m</em></div></div>
      </div>
    </section>

    <section class="card">
      <h2 id="condTitle">Conditions</h2>
      <div class="grid2">
        <div class="f"><label for="qnh">QNH</label><div class="box"><input id="qnh" inputmode="decimal" placeholder="1013"><em>hPa</em></div></div>
        <div class="f"><label for="alt">Altitude terrain</label><div class="box"><input id="alt" inputmode="decimal" placeholder="0"><em>ft</em></div></div>
        <div class="f"><label for="temp">Température θs</label><div class="box"><input id="temp" inputmode="decimal" placeholder="15"><em>°C</em></div></div>
        <div class="f"><label for="vent">Vent de face</label><div class="box"><input id="vent" inputmode="decimal" placeholder="0"><em>kt</em></div></div>
        <div class="f"><label for="conso">Consommation</label><div class="box"><input id="conso" inputmode="decimal" placeholder="500"><em>kg/h</em></div></div>
      </div>
      <div class="derived"><span class="chip">Zp <b id="o-zp">—</b></span><span class="chip">Alt. densité ≈ <b id="o-zs">—</b></span></div>
    </section>

    <section class="card">
      <h2>Chargement &amp; centrage</h2>
      <div id="vide"></div>
      <div class="grp"><div class="gh"><span>Équipage et carburant</span></div><div id="lines-crew"></div></div>
      <div class="grp"><div class="gh"><span>Équipements, fret et passagers</span><button class="addbtn" type="button" id="addLibre">+ Ajouter</button></div><div id="lines-fret"></div><div id="ext-perf"></div></div>
      <div class="tot">
        <span class="k">Masse totale</span><span class="v" id="o-m">—</span>
        <span class="k">Centrage</span><span class="v2" id="o-x">—</span>
        <span class="k">Centrage sans carburant</span><span class="v2" id="o-x0">—</span>
      </div>
      <div class="envwrap" id="env" role="button" tabindex="0" title="Agrandir"></div>
    </section>

    <section class="card">
      <h2>Optionnels</h2>
      <div class="opts" id="opts"></div>
    </section>

  </aside>

  <div>
  <section class="card" id="mission" hidden>
    <h2>Trajet</h2>
    <div class="grid4">
      <div class="f"><label for="m-dist">Distance</label><div class="box"><input id="m-dist" inputmode="decimal" placeholder="0"><em>NM</em></div></div>
      <div class="f"><label for="m-gs">Vitesse sol</label><div class="box"><input id="m-gs" inputmode="decimal" placeholder="120"><em>kt</em></div></div>
      <div class="f"><label for="m-res">Réserve à l’arrivée</label><div class="box"><input id="m-res" inputmode="decimal" placeholder="160"><em>kg</em></div></div>
    </div>
    <h2 style="margin-top:16px">Zone de poser</h2>
    <div class="grid4">
      <div class="f"><label for="m-alt">Altitude</label><div class="box"><input id="m-alt" inputmode="decimal" placeholder="0"><em>ft</em></div></div>
      <div class="f"><label for="m-temp">Température θs</label><div class="box"><input id="m-temp" inputmode="decimal" placeholder="15"><em>°C</em></div></div>
      <div class="f"><label for="m-qnh">QNH</label><div class="box"><input id="m-qnh" inputmode="decimal" placeholder="départ"><em>hPa</em></div></div>
      <div class="f" id="m-bras-f"><label for="m-bras">Bras de la charge</label><div class="box"><input id="m-bras" inputmode="decimal" placeholder="4.70"><em>m</em></div></div>
    </div>
    <div id="m-ext"></div>
  </section>
  <section id="results"></section>
  </div>
</main>




<div id="kp" role="group" aria-label="Pavé numérique"><div class="kh"><span id="kpl"></span><b id="kpv"></b></div><div class="kg">

  <button type="button" data-k=",">,</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="clr">C</button><button type="button" class="ok" data-k="ok">OK</button>
</div></div>

<dialog id="chart">
  <div class="dh"><h3 id="chartTitle">Abaque</h3><button class="btn pri" id="closechart" type="button">Fermer</button></div>
  <div class="db" id="chartBody"></div>
</dialog>

<script>// Transposition de la feuille DATA du carton
// « FCC ENT PANNE MOTEUR COUGAR – Calculs approuvés par escadrille » (version 11 juin 2024).
// Les coefficients des courbes sont ceux du tableur, sans modification, sauf les
// corrections signalées « CORRIGÉ ».
// Chaque fonction renvoie aussi des avertissements quand une entrée sort du domaine
// couvert par le tableur (là où Excel afficherait #N/A ou extrapolerait).

(function (root) {
  'use strict';

  // VLOOKUP approché d'Excel sur une liste triée : plus grande valeur <= x.
  // Si x est sous la première valeur, Excel renvoie #N/A : on prend la première
  // et on le signale.
  function vlook(x, keys, warn, label) {
    let idx = -1;
    for (let i = 0; i < keys.length; i++) if (keys[i] <= x) idx = i;
    if (idx < 0) {
      if (warn) warn.push(label + ' : valeur ' + round1(x) + ' sous le domaine du carton (' + keys[0] + '), valeur limite utilisée');
      return { key: keys[0], i: 0, below: true };
    }
    return { key: keys[idx], i: idx, below: false };
  }

  // ------------------------- Carton complet
  // p (pénalités, toutes facultatives ; valeurs par défaut = carton escadrille : EAP fermées + sponsons)
  //   dTcatA   : écart de température pour fig 6 terrain dégagé et fig 8 2/2 (défaut +5 EAP)
  //   dTclimb  : écart de température pour fig 3 et fig 4 (défaut +5 EAP)
  //   dTponct  : écart de température pour fig 6 aire ponctuelle (défaut 0)
  //   dThover  : écart de température pour fig 2 (défaut 0)
  //   dTvsd    : écart de température pour fig 9 (défaut 0)
  //   fHover   : facteur sur fig 2 et fig 6 aire ponctuelle (défaut 0.98 EAP)
  //   massPen  : pénalité de masse sur fig 6 terrain dégagé (défaut 100 kg sponsons)
  //   vz45Pen  : pénalité sur Vz à 45 kt (défaut 0)
  //   vzVyPen  : pénalité sur Vz à Vy (défaut 50 sponsons ; compatibilité : opts.flotta -> 75)
  function carton(inp, p) {
    p = p || {};
    const d = (k, v) => (p[k] === undefined ? v : p[k]);
    const dTcatA = d('dTcatA', 5), dTclimb = d('dTclimb', 5), dTponct = d('dTponct', 0), dThover = d('dThover', 0), dTvsd = d('dTvsd', 0);
    const fHover = d('fHover', 0.98), massPen = d('massPen', 100), vz45Pen = d('vz45Pen', 0);
    const vzVyPen = d('vzVyPen', p.flotta ? 75 : 50);

    const T = inp.T, Zp = inp.Zp, M = inp.M, vent = inp.vent;

    const massePonctuelleAtt = Math.min(l45 * fHover, 8300);

    const masseMono15ft = m15 * fHover;

    const mVz100 = masseVz100(v45.x, warn, 100 + vz45Pen);
    const vy = vzVy(T + dTclimb, Zp, M, warn);

    if (Zp > 5000) warn.push('V1 : le carton n\'a que les courbes Zp 0 et 5000 ft, valeur 5000 ft retenue (conservatif)');
    if (T + 25 > 50) warn.push('θs + 25 °C dépasse 50 °C : point A\' hors abaque');

    const dec = decision(mc, T + dTcatA, vent, Zp, warn);
    const v = vsd(T + dTvsd, Zp, M, warn);

    const hvA = pointA(M, Zp, T, warn);
    const hvA2 = pointA(M, Zp, T + 25, warn);

    return {
      Zp, T, M, dTcatA, dTclimb, dThover, fHover, massPen, vz45Pen, vzVyPen,

  const MMAX = 9000;

  // masse sur une courbe θs donnée pour une Zp (courbe Zp décroissante avec la masse)
  function masseSurCourbe(pts, Zp) {

    const tb = HD[fig];
    const TS = Object.keys(tb).map(Number).sort((a, b) => a - b);
    const out = { brut: NaN, masse: NaN, limiteeMmax: false, hors: null };
    if (T < TS[0] || T > TS[TS.length - 1]) { out.hors = 'θs ' + T + ' °C hors des courbes (' + TS[0] + ' à +' + TS[TS.length - 1] + ' °C)'; return out; }
    if (T > isaPlus35(Zp)) { out.hors = 'θs au-delà de STD +35 °C (limite de l\'abaque)'; return out; }
    if (Zp < -2000 || Zp > ZMAX[fig]) { out.hors = 'Zp hors abaque'; return out; }
    const TEMPS = TS;
    let i = TEMPS.findIndex((t, k) => k < TEMPS.length - 1 && T >= t && T <= TEMPS[k + 1]);

    if (a.ext || b.ext) { out.hors = 'point au-delà du début des courbes θs (abaque non tracé)'; return out; }

    out.sup = !!(a.sup || b.sup); // valeur lue au bord : la masse réelle est au moins égale

  const CD = (typeof CATA_DATA !== 'undefined') ? CATA_DATA : require('./cata_data.js');

  function masseCatA(tab, T, Zp, zs) {

    if (Zp < -2000 || Zp > 15000) return { hors: 'Zp hors abaque' };
    const i = TC.findIndex((t, k) => k < TC.length - 1 && T >= t && T <= TC[k + 1]);

    r.Thover = T + dT;
    // SUP.15 : avec charge externe largable, masse max au décollage et à l'atterrissage = masse HES 2 GTM (fig 2), 9350 kg maxi
    {

<script>// Masse et centrage longitudinal (PMV section 2.2 fig 1, section 6.1 et 6.2)
(function (root) {

  // Carburant — modèle simplifié (consigne escadrille), remplissage dans l'ordre :
  //   1. réservoirs longitudinaux 1L + 2L (nourrices) : 179 + 171 = 350 kg (APP.7.9 §1.3)
  //      bras 4,58 m (table 6.2 §2.2 aux faibles quantités : seules les nourrices contiennent du carburant)
  //   2. réservoirs transversaux 1T, 2T, 5e et 7e, traités en un seul bloc : 1568 − 350 = 1218 kg

  //   3. réservoirs d'ailettes (SUP.28) : 2 × 257 kg (APP.7.9 §1.3), bras C = 6,63 m (6.2 §2.1)
  const FUEL = { long: { kg: 350, bras: 4.58 }, trans: { kg: 1218 }, ail: { kg: 514, bras: 6.63 }, plein6: 1568, xPlein: 4.386 };
  FUEL.trans.bras = (FUEL.plein6 * FUEL.xPlein - FUEL.long.kg * FUEL.long.bras) / FUEL.trans.kg;

  // répartition d'une quantité totale ; ailettes : réservoirs d'ailettes montés
  function repartCarb(kg, ailettes, warn) {
    const cap = FUEL.plein6 + (ailettes ? FUEL.ail.kg : 0);
    if (kg > cap + 1e-6) warn.push('Carburant : ' + Math.round(kg) + ' kg dépasse la capacité ' + (ailettes ? 'des 6 réservoirs + ailettes (' + cap + ' kg)' : 'des 6 réservoirs (1568 kg, réservoirs d\'ailettes non cochés)'));
    let r = Math.max(0, kg);
    const L = Math.min(r, FUEL.long.kg); r -= L;
    const T = Math.min(r, FUEL.trans.kg); r -= T;
    const A = ailettes ? Math.min(r, FUEL.ail.kg) : 0; r -= A;
    const parts = [{ nom: 'Longitudinaux', kg: L, bras: FUEL.long.bras }, { nom: 'Transversaux', kg: T, bras: FUEL.trans.bras }, { nom: 'Ailettes', kg: A, bras: FUEL.ail.bras }];
    if (r > 1e-6) parts.push({ nom: 'Excédent', kg: r, bras: ailettes ? FUEL.ail.bras : FUEL.trans.bras });
    const mom = parts.reduce((s, p) => s + p.kg * p.bras, 0);

  }

  // Types de lignes de chargement et bras de levier (m)
  const TYPES = {
    vide: { nom: 'Masse à vide' },
    equip: { nom: 'Équipage', bras: 1.92 }, // centrage pris au poste 3e homme
    pil: { nom: 'Pilote + copilote', bras: 1.28 },

    palav: { nom: 'Fret palette avant', bras: 3.89 },
    palar: { nom: 'Fret palette arrière', bras: 5.69 },
    palc: { nom: 'Palette centrale', bras: 4.70 },
    treuil: { nom: 'Charge au treuil', bras: 4.23 },
    elingue: { nom: 'Charge à l’élingue', bras: 4.86, externe: true }, // 6.2 §4.2 fig 10, SUP.15

  function calcul(lignes, appareil) {

      if (l.type === 'vide') mom = kg * (Number(appareil.cg) || 0);
      else if (l.type === 'carb') mom = momentCarb(kg, !!appareil.ailettes, warn);
      else mom = kg * (t.libre ? Number(l.bras) || 0 : t.bras);

    // On vérifie l'appareil sans la charge dans le domaine, et l'ensemble (≤ 9350 kg) dans le domaine,

    const okAvec = (Mt, mom) => {

    s8b: { x: g => 270.94 + 20.166 * g, yM: lin(5000, 728, 10000, 140), yTD: lin(4, 705, 10, 423), xd: lin(100, 766, 400, 1040), yV1: lin(30, 1316.5, 60, 963), left: 233.5, dAxis: 751 },
    h5: { xM: lin(4000, 228.5, 9000, 571.5), y: r => 1240 - r * 34.75, xA: lin(100, 643.5, 500, 927), bottom: 1240 },
    // 5.1 fig 16 : x de Fig16 en pixels 300 dpi ; grille Zp 0 ft y = 1870, 25 000 ft y = 886 ; Vz −500 y = 1967, 1500 y = 2552 (300 dpi)
    v16: { x: v => v / 2, y: z => (1870 - 0.039362 * z) / 2, vz: v => (2114 + 0.29254 * v) / 2, left: 304, vzMin: -500, vzMax: 1500 },
    s15: { x: lin(5000, 518 / 2, 9000, 1941 / 2), y: lin(20000, 541 / 2, 0, 2095 / 2), m0: 5000, m1: 9400, z0: -2000, z1: 20000, fig: 'sup15' },
  };

  // ---------- dessin ----------
  const C1 = '#ff5a00', HALO = '#ffffff';
  const fr = (v, d = 0) => isFinite(v) ? v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
  function pl(pts, o) {
    o = o || {};
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
    const w = o.w || 4, col = o.c || C1, dash = o.dash ? ` stroke-dasharray="${o.dash}"` : '';
    return `<path d="${d}" fill="none" stroke="${HALO}" stroke-width="${w + 4}" stroke-linejoin="round" stroke-linecap="round" opacity=".9"${dash}/>` +
      `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${dash}/>` +
      (o.arrow ? arrow(pts[pts.length - 2], pts[pts.length - 1], col) : '');
  }
  function arrow(a, b, col) {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = 16, s = 0.45;
    const p1 = [b[0] - L * Math.cos(ang - s), b[1] - L * Math.sin(ang - s)], p2 = [b[0] - L * Math.cos(ang + s), b[1] - L * Math.sin(ang + s)];
    return `<path d="M${b[0]},${b[1]} L${p1[0]},${p1[1]} L${p2[0]},${p2[1]} Z" fill="${col}" stroke="${HALO}" stroke-width="1.5"/>`;
  }
  const dot = (p, c) => `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${c || C1}" stroke="${HALO}" stroke-width="3"/>`;
  function lab(p, t, o) {
    o = o || {};
    const fs = 22, w = t.length * fs * 0.56 + 16, h = fs + 12;
    let x = p[0] + (o.dx || 12), y = p[1] + (o.dy || -14);
    if (o.anchor === 'end') x -= w + 2 * (o.dx || 12);
    return `<g><rect x="${x}" y="${y - h + 8}" width="${w}" height="${h}" rx="7" fill="${o.bg || C1}" opacity=".95"/>` +
      `<text x="${x + 8}" y="${y}" font-size="${fs}" font-weight="700" font-family="-apple-system,Helvetica,Arial" fill="#fff">${t}</text></g>`;
  }
  function svg(id, body) {
    const I = IMG[id];
    return `<svg viewBox="${I.ox} ${I.oy} ${I.w} ${I.h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;background:#fff">` +
      `<image href="${I.src}" x="${I.ox}" y="${I.oy}" width="${I.w}" height="${I.h}"/>${body}</svg>`;
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- figures ----------
  // Stationnaire 5.1 fig 7/8/9 : courbe θs interpolée + point
  function hover(id, T, Zp, Mbrut, M, sup) {
    const c = CAL[id], P = root.Perf;
    const curve = [];
    for (let z = c.z0; z <= c.z1; z += 250) {
      const q = P.masseStatio(c.fig, T, z, [], '');
      if (!q.hors && !q.sup && q.brut >= c.m0) curve.push([c.x(q.brut), c.y(z)]);
    }
    const mp = clamp(Mbrut, c.m0, c.m1), pt = [c.x(mp), c.y(Zp)];
    let b = '';
    if (curve.length > 1) b += pl(curve, { w: 3, dash: '10 7' });
    b += pl([[c.x(c.m0), pt[1]], pt], { arrow: true });
    b += pl([pt, [pt[0], c.y(c.z0)]], { arrow: true });
    b += pl([[c.x(M), c.y(c.z1)], [c.x(M), c.y(c.z0)]], { w: 2.5, c: '#0b7a3e', dash: '6 6' });
    b += dot(pt) + lab(pt, (sup ? '≥ ' : '') + fr(Math.min(Mbrut, c.m1)) + ' kg', { dx: 14, dy: -16, anchor: pt[0] > c.x(8400) ? 'end' : '' });
    b += lab([c.x(M), c.y(c.z1) + 40], 'masse ' + fr(M), { bg: '#0b7a3e', anchor: c.x(M) > c.x(8400) ? 'end' : '' });
    b += lab([c.x(c.m0), pt[1]], 'Zp ' + fr(Zp), { dx: 6, dy: 40, bg: '#333' });
    b += lab([c.x(c.m0) + 10, c.y(c.z1) + 40], 'θs ' + fr(T, 1).replace(',0', '') + ' °C (courbe pointillée)', { bg: C1 });
    return svg(id, b);
  }
  // SUP.1 fig 1 / fig 2 : courbe θs interpolée + point
  function catA(id, T, Zp, Mbrut, M, sup) {
    const c = CAL[id], P = root.Perf;
    const curve = [];
    for (let z = c.z0; z <= c.z1; z += 250) {
      const r = P.masseCatA(c.tab, T, z, -99);
      if (!r.hors && !r.sup && r.brut >= c.m0) curve.push([c.x(r.brut), c.y(z)]);
    }
    const pt = [c.x(clamp(Mbrut, c.m0, c.m1)), c.y(Zp)];
    let b = '';
    if (curve.length > 1) b += pl(curve, { w: 3, dash: '10 7' });
    b += pl([[c.x(c.m0), pt[1]], pt], { arrow: true }) + pl([pt, [pt[0], c.y(c.z0)]], { arrow: true });
    b += pl([[c.x(M), c.y(c.z1)], [c.x(M), c.y(c.z0)]], { w: 2.5, c: '#0b7a3e', dash: '6 6' });
    b += dot(pt) + lab(pt, (sup ? '≥ ' : '') + fr(Mbrut) + ' kg', { anchor: pt[0] > c.x(7800) ? 'end' : '' });
    b += lab([c.x(M), c.y(c.z1) + 40], 'masse ' + fr(M), { bg: '#0b7a3e', anchor: c.x(M) > c.x(7800) ? 'end' : '' });
    b += lab([c.x(c.m0), pt[1]], 'Zp ' + fr(Zp), { dx: 6, dy: 40, bg: '#333' });
    b += lab([c.x(c.m0) + 10, c.y(c.z1) + 40], 'θs ' + fr(T) + ' °C (courbe pointillée)', { bg: C1 });
    return svg(id, b);
  }
  // SUP.3 fig 2 / fig 6 : point masse–Zp
  function point(id, T, Zp, Mfig, lbl, sup) {
    const c = CAL[id];
    const pt = [c.x(clamp(Mfig, c.m0, c.m1)), c.y(Zp)];
    let b = pl([[c.x(c.m0), pt[1]], pt], { arrow: true }) + pl([pt, [pt[0], c.y(c.z0)]], { arrow: true });
    b += dot(pt) + lab(pt, (sup ? '≥ ' : '') + fr(Math.min(Mfig, c.m1)) + ' kg', { anchor: pt[0] > c.x(7600) ? 'end' : '' });
    b += lab([c.x(c.m0), pt[1]], 'Zp ' + fr(Zp), { dx: 6, dy: 40, bg: '#333' });
    b += lab([c.x(c.m0) + 10, c.y(c.z1) + 120], lbl || ('θs ' + fr(T) + ' °C'), { bg: C1 });
    return svg(id, b);
  }
  // SUP.3 fig 3 / fig 4 : Zp -> θs -> masse -> Vz
  function vz(id, T, Zp, x, vzVal, lbl) {
    const c = CAL[id];
    const X = c.x(x), Y = c.y(Zp), V = c.vz(clamp(vzVal, c.vzMin, c.vzMax));
    let b = pl([[c.left, Y], [X, Y]], { arrow: true }) + pl([[X, Y], [X, V]], { arrow: true }) + pl([[X, V], [c.left, V]], { arrow: true });
    b += dot([X, Y]) + dot([X, V]);
    b += lab([X, Y], 'θs ' + fr(T) + ' °C · Zp ' + fr(Zp), { dy: -16 });
    b += lab([X, V], (lbl || '') + fr(vzVal) + ' ft/min', { dy: 34 });
    return svg(id, b);
  }
  function vsd(T, Zp, x, vsdBrut) {
    const c = CAL.s9;
    const X = c.x(x), Y = c.y(Zp), V = c.vi(clamp(vsdBrut, 40, 60));
    let b = pl([[c.left, Y], [X, Y]], { arrow: true }) + pl([[X, Y], [X, V]], { arrow: true });
    if (vsdBrut >= 40) b += pl([[X, V], [c.left, V]], { arrow: true });
    b += dot([X, Y]) + lab([X, Y], 'θs ' + fr(T) + ' °C · Zp ' + fr(Zp), { dy: -16 });
    b += lab([X, V], vsdBrut < 45 ? 'VSD < 45 → 45 kt' : 'VSD ' + fr(vsdBrut, 1) + ' kt', { dy: 34 });
    return svg('s9', b);
  }
  function corrigee(T, zs, Mc, M) {
    const c = CAL.s8a;
    const X = c.x(zs), YT = c.yT(T), YM = c.yM(clamp(Mc, 5000, 10000));
    let b = pl([[c.right, YT], [X, YT]], { arrow: true }) + pl([[X, YT], [X, YM]], { arrow: true }) + pl([[X, YM], [c.right, YM]], { arrow: true });
    b += dot([X, YT]) + dot([X, YM]);
    b += lab([X, YT], 'θs ' + fr(T) + ' °C · Zσ ' + fr(zs * 1000) + ' ft', { dy: 36 });
    b += lab([X, YM], 'masse ' + fr(M) + ' → Mc ' + fr(Mc) + ' kg', { dy: -16 });
    return svg('s8a', b);
  }
  function decision(P, vent) {
    const c = CAL.s8b;
    const X = c.x(P.G25), YM = c.yM(clamp(P.masseCorrigee, 5000, 10000)), YT = c.yTD(clamp(P.TDbrut, 3, 10.5));
    const XD = c.xd(clamp(P.DAAbrut, 50, 450)), XD1 = c.xd(clamp(P.D1brut, 50, 450)), YV = c.yV1(clamp(P.V1brut, 30, 60));
    let b = pl([[c.left, YM], [X, YM]], { arrow: true }) + pl([[X, YM], [X, YT]], { arrow: true });
    b += pl([[X, YT], [XD1, YT]], {}) + pl([[XD, YT], [XD, c.dAxis]], { arrow: true }) + pl([[XD1, YT], [XD1, c.dAxis]], { arrow: true });
    b += pl([[X, YT], [X, YV]], { arrow: true }) + pl([[X, YV], [c.left, YV]], { arrow: true });
    b += dot([X, YM]) + dot([X, YT]) + dot([X, YV]);
    b += lab([X, YM], 'Mc ' + fr(P.masseCorrigee) + ' kg · θs ' + fr(P.Tcat) + ' °C', { dy: -16 });
    b += lab([X, YT], 'vent ' + fr(vent) + ' kt · TcD ' + fr(P.TDbrut, 1) + ' s', { dy: -16 });
    b += lab([XD, c.dAxis], 'DAA ' + fr(P.DAAbrut), { dy: 40, anchor: 'end', dx: -4 });
    b += lab([XD1, c.dAxis], 'D1 ' + fr(P.D1brut), { dy: 40, dx: 4 });
    b += lab([X, YV], 'Zp ' + fr(P.Zp) + ' · V1 ' + fr(P.V1brut, 1) + ' kt', { dy: 36 });
    return svg('s8b', b);
  }
  function hv(M, Zp, T, r, A) {
    const c = CAL.h5;
    const X = c.xM(clamp(M, 4000, 9000)), Y = c.y(clamp(r, 0, 16)), XA = c.xA(clamp(A, 100, 550));
    let b = pl([[X, c.bottom], [X, Y]], { arrow: true }) + pl([[X, Y], [XA, Y]], { arrow: true }) + pl([[XA, Y], [XA, c.bottom]], { arrow: true });
    b += dot([X, Y]) + dot([XA, Y]);
    b += lab([X, Y], fr(M) + ' kg · Zp ' + fr(Zp), { dy: -16, anchor: 'end', dx: -6 });
    b += lab([XA, Y], 'θs ' + fr(T) + ' °C', { dy: -16 });
    b += lab([XA, c.bottom], A < 100 ? 'A < 100 ft' : 'A = ' + fr(A) + ' ft', { dy: -24 });
    return svg('h5', b);
  }

  // ---- SUP.1 (CAT A, performances normales)
  const K1 = { x: zs => 543 - zs * 15.22, yT: lin(50, 846, -50, 1283), yM: lin(5000, 736, 10000, 190), right: 1052 };
  function corrigeeCatA(T, zs, Mc, M) {
    const c = K1, X = c.x(zs), YT = c.yT(T), YM = c.yM(clamp(Mc, 5000, 10000));
    let b = pl([[c.right, YT], [X, YT]], { arrow: true }) + pl([[X, YT], [X, YM]], { arrow: true }) + pl([[X, YM], [c.right, YM]], { arrow: true });
    b += dot([X, YT]) + dot([X, YM]);
    b += lab([X, YT], 'θs ' + fr(T) + ' °C · Zσ ' + fr(zs * 1000) + ' ft', { dy: 36 });
    b += lab([X, YM], 'masse ' + fr(M) + ' → Mc ' + fr(Mc) + ' kg', { dy: -16 });
    return svg('k1', b);
  }
  function decisionCatA(r, T, vent, Zp) {
    const h = v => v / 2, X = h(r.X), YM = h(r.yMc), YT = h(r.yTD);
    const xd = d => h(1418 + (d - 100) * 1.77), dAxis = h(1420), left = h(453);
    const yV = v => h(2564 - (v - 30) * 22.88);
    let b = pl([[left, YM], [X, YM]], { arrow: true });
    if (r.below) b += lab([X, YM], 'hors réseau θs → minima', { dy: -16 });
    else {
      b += pl([[X, YM], [X, YT]], { arrow: true }) + dot([X, YM]);
      b += lab([X, YM], 'θs ' + fr(T) + ' °C', { dy: -16 });
    }
    if (!r.below) {
      const XD = xd(r.DAA), XD1 = r.D1 ? xd(r.D1) : null;
      b += pl([[X, YT], [XD1 || XD, YT]], {}) + pl([[XD, YT], [XD, dAxis]], { arrow: true });
      if (XD1) b += pl([[XD1, YT], [XD1, dAxis]], { arrow: true }) + lab([XD1, dAxis], 'D1 ' + fr(r.D1), { dy: 40, dx: 4 });
      b += lab([XD, dAxis], 'd ' + fr(r.DAA), { dy: 40, anchor: 'end', dx: -4 });
      b += dot([X, YT]) + lab([X, YT], 'vent ' + fr(vent) + ' kt · TcD ' + fr(r.TDbrut, 1) + ' s', { dy: -16 });
      if (r.V1brut !== undefined) {
        const YV = yV(clamp(r.V1brut, 30, 60));
        b += pl([[X, YT], [X, YV]], { arrow: true }) + pl([[X, YV], [left, YV]], { arrow: true }) + dot([X, YV]);
        b += lab([X, YV], 'Zp ' + fr(Zp) + ' · V1 ' + fr(r.V1brut, 1) + ' kt', { dy: 36 });
      }
    }
    return svg('k2', b);
  }
  function vsdCatA(r, T, Zp) {
    const h = v => v / 2, X = h(r.X), left = h(610);
    const Y = h(1939 - Zp * 0.03987), V = h(2037 + (clamp(r.brut, 40, 55) - 40) * 39.47);
    let b = pl([[left, Y], [X, Y]], { arrow: true }) + pl([[X, Y], [X, V]], { arrow: true });
    if (!r.dessus) b += pl([[X, V], [left, V]], { arrow: true });
    b += dot([X, Y]) + lab([X, Y], 'θs ' + fr(T) + ' °C · Zp ' + fr(Zp), { dy: -16, anchor: X > 450 ? 'end' : '' });
    b += lab([X, V], r.brut < 45 ? 'VSD < 45 → 45 kt' : 'VSD ' + fr(r.brut, 1) + ' kt', { dy: 34, anchor: X > 450 ? 'end' : '' });
    return svg('k3', b);
  }
  function brut(id) { return svg(id, ''); }
  root.ChartView = { corrigeeCatA, decisionCatA, vsdCatA, brut, catA, hover, point, vz, vsd, corrigee, decision, hv, CAL };
})(this);

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const KEY='perfos-cougar-v2';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}};
const persist=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);

const DEF_LINES=()=>[{id:uid(),type:'vide',kg:'',bras:''},{id:uid(),type:'equip',kg:''},{id:uid(),type:'carb',kg:''},{id:uid(),type:'libre',nom:'Passagers / fret',kg:'',bras:'4.70'}];
let st=Object.assign({tab:'n',qnh:'',alt:'',temp:'',vent:'',givrage:'none',theme:'auto',fleet:[],acId:'',opts:{eap:true,sponsons:true},lines:DEF_LINES()},load()||{});

let tSave;const save=()=>{clearTimeout(tSave);tSave=setTimeout(()=>persist(st),150)};
const num=v=>{if(v===undefined||v===null)return NaN;const s=String(v).replace(',','.').replace(/\s/g,'');return s===''||s==='-'?NaN:Number(s)};
const fr=(v,d=0)=>isFinite(v)?v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const floor10=v=>Math.floor(v/10)*10;
const CHECK='<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ---------------- conditions ----------------

st.mis=Object.assign({dist:'',gs:'',conso:'',res:'',alt:'',temp:'',qnh:'',bras:''},st.mis||{});
if(st.mis.res===undefined||st.mis.res==='')st.mis.res='160'; // réserve par défaut 160 kg, modifiable
['dist','gs','res','alt','temp','qnh','bras'].forEach(k=>{const el=$('#m-'+k);el.value=st.mis[k];el.addEventListener('input',()=>{st.mis[k]=el.value;save();calc()})});
// charge utile à l'élingue (SUP.15) : case à cocher ; reprise de l'ancien choix « bras 4,86 m »
if(st.mis.elingue===undefined){st.mis.elingue=Math.abs(num(st.mis.bras)-4.86)<1e-6;if(st.mis.elingue)st.mis.bras=''}

function renderMisExt(){const on=!!st.mis.elingue;
  $('#m-ext').innerHTML=caseOpt(on,'Charge à l’élingue','SUP.15','Charge utile au crochet, bras 4,86 m · HES avec charge externe (fig 2), 9350 kg maxi · charge ≤ 3000 kg');
  $('#m-bras-f').style.visibility=on?'hidden':'';

// ---------------- pavé numérique (tablette) ----------------

const KP={el:null,fresh:false};

  document.querySelectorAll('input.kp-on').forEach(i=>i.classList.remove('kp-on'));el.classList.add('kp-on');

  document.body.style.paddingBottom=kp.offsetHeight+'px';
  document.querySelectorAll('dialog .db').forEach(d=>d.style.paddingBottom='');const db=el.closest('.db');if(db)db.style.paddingBottom=kp.offsetHeight+'px';
  setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),30);
}
function kpHide(){const kp=$('#kp');kp.classList.remove('on');if(KP.el)KP.el.classList.remove('kp-on');KP.el=null;document.body.style.paddingBottom='';document.querySelectorAll('dialog .db').forEach(d=>d.style.paddingBottom='')}
function kpVal(){$('#kpv').textContent=KP.el?(KP.el.value||'—'):''}

document.addEventListener('focusin',e=>{const t=e.target;
  if(t.matches&&t.matches('input[data-pad]')){if(TOUCH)kpShow(t);else setTimeout(()=>{try{t.select()}catch(_){}} ,0)}
  else if(KP.el&&!t.closest('#kp'))kpHide()});
document.addEventListener('pointerdown',e=>{if(!KP.el)return;const t=e.target;if(t.closest('#kp')||(t.matches&&t.matches('input[data-pad]')))return;KP.el.blur();kpHide()},true);

  if(/^[0-9,]$/.test(k)){if(KP.fresh)v='';if(k===','&&/[,.]/.test(v))return;kpSet((v===''&&k===','?'0':'')+v+k)}

function envSvg(c,big){
  const k=big?2:1,W=340*k,H=(big?230:170)*k,x0=4.30,x1=5.00,m0=4000,m1=9500,fs=10*(big?1.5:1);
  const px=x=>34*k+(x-x0)/(x1-x0)*(W-46*k), py=m=>H-24*k-(m-m0)/(m1-m0)*(H-36*k);
  const poly=[[4.40,4500],[4.40,7000],[4.55,9000],[4.90,9000],[4.90,4500]].map(([x,m])=>px(x).toFixed(1)+','+py(m).toFixed(1)).join(' ');
  let g='';
  [4.4,4.5,4.6,4.7,4.8,4.9].forEach(x=>g+=`<line x1="${px(x)}" y1="${py(m0)}" x2="${px(x)}" y2="${py(m1)}" stroke="var(--line)"/><text x="${px(x)}" y="${H-8*k}" text-anchor="middle" fill="var(--muted)" font-size="${fs}">${x.toFixed(2).replace('.',',')}</text>`);
  [4500,6000,7500,9000].forEach(m=>g+=`<line x1="${px(x0)}" y1="${py(m)}" x2="${px(x1)}" y2="${py(m)}" stroke="var(--line)"/><text x="${px(x0)-4}" y="${py(m)+3*k}" font-size="${fs}" text-anchor="end" fill="var(--muted)">${(m/1000).toString().replace('.',',')} t</text>`);
  let pts='';
  if(c&&isFinite(c.x)&&c.M>0){
    const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
    const P=[cl(px(c.x),px(x0),px(x1)),cl(py(c.M),py(m1),py(m0))];
    if(isFinite(c.sansCarb.x)&&c.sansCarb.M>0&&c.sansCarb.M!==c.M){const Q=[cl(px(c.sansCarb.x),px(x0),px(x1)),cl(py(c.sansCarb.M),py(m1),py(m0))];
      pts+=`<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="var(--ink2)" stroke-dasharray="3 3"/><circle cx="${Q[0]}" cy="${Q[1]}" r="5" fill="var(--surface)" stroke="${c.sansCarb.ok?'var(--ok)':'var(--ko)'}" stroke-width="2.5"/>`}
    pts+=`<circle cx="${P[0]}" cy="${P[1]}" r="${6.5*(big?1.4:1)}" fill="${c.ok?'var(--ok)':'var(--ko)'}" stroke="var(--surface)" stroke-width="2"/>`;
    if(big){const t=(x,y,txt,col,anc)=>`<text x="${x}" y="${y}" font-size="${fs}" font-weight="700" fill="${col}" text-anchor="${anc||'start'}" paint-order="stroke" stroke="var(--surface)" stroke-width="4">${txt}</text>`;
      pts+=t(P[0]+14,P[1]-10,'Décollage '+fr(c.M)+' kg · '+fr(c.x,3)+' m',c.ok?'var(--ok)':'var(--ko)',P[0]>px(4.7)?'end':'start');
      if(isFinite(c.sansCarb.x)&&c.sansCarb.M>0&&c.sansCarb.M!==c.M){const Q=[cl(px(c.sansCarb.x),px(x0),px(x1)),cl(py(c.sansCarb.M),py(m1),py(m0))];
        pts+=t(Q[0]+14,Q[1]+22,'Sans carburant '+fr(c.sansCarb.M)+' kg · '+fr(c.sansCarb.x,3)+' m',c.sansCarb.ok?'var(--ok)':'var(--ko)',Q[0]>px(4.7)?'end':'start')}
      [[4.40,4500,'4,40'],[4.55,9000,'4,55'],[4.90,9000,'4,90']].forEach(([x,m,l])=>pts+=`<text x="${px(x)+4}" y="${py(m)-6}" font-size="${fs*0.9}" fill="var(--accent)">${l}</text>`)}
  }
  // charge externe : prolongement 9000 → 9350 kg entre 4,55 et 4,90 m (ensemble appareil + charge)
  if(c&&c.ext)g+=`<polygon points="${[[4.55,9000],[4.55,9350],[4.90,9350],[4.90,9000]].map(([x,m])=>px(x).toFixed(1)+','+py(m).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Domaine masse-centrage">${g}<polygon points="${poly}" fill="color-mix(in srgb,var(--accent) 14%,transparent)" stroke="var(--accent)" stroke-width="2"/>${pts}<text x="${W-6}" y="${12*k}" font-size="${fs}" text-anchor="end" fill="var(--muted)">● décollage  ○ sans carburant · 2.2 fig 1</text></svg>`;
}
function hvSvg(A){
  const W=420,H=230,top=Math.max(220,(A||0)+30),px=v=>44+v/35*(W-64),py=h=>H-30-h/top*(H-48);
  let g='';for(let v=0;v<=30;v+=10)g+=`<line x1="${px(v)}" y1="${py(0)}" x2="${px(v)}" y2="${py(top)}" stroke="var(--line)"/><text x="${px(v)}" y="${H-10}" font-size="12" text-anchor="middle" fill="var(--muted)">${v} kt</text>`;
  for(let h=0;h<=top;h+=50)g+=`<line x1="${px(0)}" y1="${py(h)}" x2="${px(35)}" y2="${py(h)}" stroke="var(--line)"/><text x="${px(0)-8}" y="${py(h)+4}" font-size="12" text-anchor="end" fill="var(--muted)">${h}</text>`;
  let p='';
  if(A>=100){const up=[];for(let v=0;v<=30;v++)up.push([v,100+(A-100)*(1-(v/30)**2)]);
    const pts=up.concat([[30,100],[29.6,85],[28.5,70],[25,50],[20,37],[10,25],[0,20]]);
    p=`<path d="M${pts.map(q=>px(q[0]).toFixed(1)+','+py(q[1]).toFixed(1)).join(' L')} Z" fill="color-mix(in srgb,var(--ko) 16%,transparent)" stroke="var(--ko)" stroke-width="2.5"/>`+
      [[0,A,'A'],[30,100,'B'],[0,20,'C']].map(([v,h,l])=>`<circle cx="${px(v)}" cy="${py(h)}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="${px(v)+(v?-14:10)}" y="${py(h)-9}" font-size="14" font-weight="700" fill="var(--ink)">${l}</text>`).join('')}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zone à éviter du domaine hauteur-vitesse"><text x="6" y="14" font-size="12" fill="var(--muted)">ft</text>${g}${p}</svg>`;
}

// ---------------- calcul ----------------
function calc(){
  const qnh=num(st.qnh),alt=num(st.alt),T=num(st.temp),vent=isFinite(num(st.vent))?num(st.vent):0;
  const okCond=isFinite(qnh)&&isFinite(alt)&&isFinite(T);
  const Zp=okCond?Carton.zpFromQnh(alt,qnh):NaN;
  $('#o-zp').textContent=isFinite(Zp)?fr(Zp)+' ft':'—';
  const zs=okCond?Carton.zsigma(T,Zp,[]):NaN;
  $('#o-zs').textContent=isFinite(zs)?fr(Math.round(zs*10)*100)+' ft':'—';

  const ac=curAc();
  const C=CG.calcul([{type:'vide',kg:ac?num(ac.mv):NaN}].concat(st.lines.filter(l=>l.type!=='vide').map(l=>({type:l.type,nom:l.nom,kg:num(l.kg),bras:num(l.bras)})),st.items.map(it=>({type:'libre',nom:it.nom,kg:(it.sign||1)*it.kg*it.qty,bras:it.bras}))),{cg:ac?num(ac.cg):NaN,ailettes:!!st.opts.sponsons});
  {const cl=st.lines.find(l=>l.type==='carb'),kc=cl?num(cl.kg):NaN,ci=$('#carbinfo'),ca=$('#carbarm');
   if(ci){const rp=CG.repartCarb(kc>0?kc:0,!!st.opts.sponsons,[]);
    const AB={Longitudinaux:'Long.',Transversaux:'Transv.',Ailettes:'Ailettes',Excédent:'Excédent'};
    ci.innerHTML=kc>0?rp.parts.filter(p=>p.nom!=='Ailettes'||st.opts.sponsons).map(p=>p.nom==='Excédent'?`<b style="color:var(--ko)">Excédent ${fr(p.kg)}</b>`:`${AB[p.nom]} ${fr(p.kg)}`).join(' · '):(st.opts.sponsons?'6 réservoirs 1568 + ailettes 514 kg':'6 réservoirs · 1568 kg max');
    ca.textContent=kc>0?fr(rp.mom/kc,3)+' m':'—'}}
  const M=C.M;
  $('#o-m').innerHTML=M>0?fr(M)+'<small>kg</small>':'—';
  const xs=c=>c.M>0&&isFinite(c.x)?`<span style="color:${c.ok?'var(--ok)':'var(--ko)'}">${fr(c.x,3)} m ${c.ok?'✓':'✗'}</span>`:'—';
  $('#o-x').innerHTML=xs(C);$('#o-x0').innerHTML=xs(C.sansCarb);
  $('#env').innerHTML=envSvg(M>0?C:null);LASTC=M>0?C:null;

  const PEN=Options.penalites(st.opts);
  const miss=[];
  if(!(num(ac.mv)>0))miss.push('masse à vide (carte Appareil)');if(!(num(ac.cg)>0))miss.push('centrage à vide (carte Appareil)');
  if(!isFinite(qnh))miss.push('QNH');if(!isFinite(alt))miss.push('altitude terrain');if(!isFinite(T))miss.push('température');
  const ready=miss.length===0&&M>0;
  const R=$('#results');
  if(!ready){R.innerHTML=`<div class="card empty"><b style="color:var(--ink)">Il manque :</b><br>${miss.map(esc).join('<br>')}</div>`;return}

  // alertes communes
  const common=[];
  const EXT=C.ext; // charge à l'élingue (SUP.15)
  if(EXT){
    if(M>9350)common.push(['Masse totale avec charge externe supérieure à la masse maximale absolue de 9350 kg (SUP.15 §2.2).','ko']);
    if(EXT.M>9000)common.push(['Masse de l’appareil sans la charge externe supérieure à 9000 kg (SUP.15 §2.2, nota).','ko']);
    if(EXT.kg>3000)common.push(['Charge à l’élingue supérieure à la charge maximale autorisée de 3000 kg (SUP.15 §2.1).','ko']);
    common.push(['Charge externe '+fr(EXT.kg)+' kg : vitesse maxi '+(M>8600?'100':(EXT.kg>2000?'110':'125'))+' kt avec une charge compacte (moins si volumineuse), inclinaison maxi 25° (SUP.15 §2.3 et 2.4). Masse max au décollage et à l’atterrissage = masse HES (SUP.15 fig 2). Centrage contrôlé sur l’appareil sans la charge ('+fr(EXT.M)+' kg · '+fr(EXT.x,3)+' m, domaine 2.2 fig 1) et sur l’ensemble avec la charge à 4,86 m ('+fr(C.x,3)+' m, domaine prolongé à 4,55 – 4,90 m au-delà de 9000 kg).','in']);
  }else if(M>9000)common.push(['Masse totale supérieure à la masse maximale de 9000 kg (2.2).','ko']);
  if(M<4500)common.push(['Masse totale inférieure à la masse minimale en vol de 4500 kg (2.2).','ko']);
  if(!C.ok&&isFinite(C.x))common.push(['Centrage au décollage hors domaine (2.2 fig 1).','ko']);
  if(C.sansCarb.M>0&&!C.sansCarb.ok&&isFinite(C.sansCarb.x))common.push(['Centrage sans carburant hors domaine : vérifier l’évolution en vol (2.2).','ko']);
  C.warnings.forEach(w=>common.push([w]));
  if(PEN.sponsonsIgnores)common.push(['Flottabilité de secours cochée : elle remplace les sponsons (−150 kg au lieu de −100 kg, −75 ft/min à Vy au lieu de −50), sans cumul.','in']);

  const HA=(why)=>pill('na','Hors abaque');
  const horsTile=(l,why,ref,chart)=>tile({l,v:'—',state:'na',status:pill('na','Hors abaque'),ref:esc(why)+(ref?' · '+ref:''),chart});
  const ge=(sup,v)=>(sup?'≥ ':'')+fr(v);
  const verdict=(rows,title,note)=>{
    const ok=rows.every(r=>r.ok);
    return `<div class="verdict ${rows.some(r=>r.ok)?'':'b'}"><div class="vh"><span>${title}</span></div><div class="vrows">${rows.map(r=>`<div class="vr"><span>${r.l}</span><b class="${r.ok?'ca':'cb'}">${r.ok?'CAT A':'CAT B'}</b><small>${esc(r.why)}</small></div>`).join('')}</div>${note?`<div class="vn">${note}</div>`:''}</div>`;
  };

  if(st.tab==='n'){
    const N=Perf.normales({T,Zp,M,vent},{fHover:PEN.normal.fHover,dThover:PEN.normal.dThover,eapCatA:!!st.opts.eap,skis:!!st.opts.skis});
    const pens=[];if(PEN.normal.fHover<1)pens.push('Statio −2 % (EAP)');if(PEN.normal.dThover)pens.push('Statio θs '+sgn(PEN.normal.dThover)+' °C (DDJ)');
    if(st.opts.eap)pens.push('CAT A : terrain dégagé θs +5 °C, aire ponctuelle −2 % (EAP)');if(st.opts.skis)pens.push('CAT A terrain dégagé −150 kg (skis)');
    const bi=(k,l,ref)=>{const r=N[k];if(r.hors)return horsTile(l,r.hors,ref,k);const m=floor10(r.masse),mg=m-M;
      return tile({l,v:(r.sup&&!r.limiteeMmax?'≥ ':'')+fr(m),u:'kg',big:true,chart:k,state:mg>=0?'ok':'ko',status:pill(mg>=0?'ok':'ko',(mg>=0?'Marge +':'Dépassement ')+fr(Math.abs(mg))+' kg'),ref:ref+(r.limiteeMmax?' · limitée à 9000 kg':'')})};
    // CAT A
    const ca=N.catA, daOk=ca.zs<=8;
    const cRow=(l,o)=>{if(o.hors)return{l,ok:false,why:'hors abaque : '+o.hors};const m=floor10(o.masse);return{l,ok:daOk&&M<=m,why:'masse '+fr(M)+' kg '+(M<=m?'≤':'>')+' masse max '+(o.sup?'≥ ':'')+fr(m)+' kg'+(o.sup?' (lue au bord de l\u2019abaque)':'')+(daOk?'':' · altitude densité > 8000 ft')}};
    const rowsA=[cRow('Terrain dégagé · décollage et atterrissage',ca.degage),cRow('Aire ponctuelle · décollage',ca.ponctDeco),cRow('Aire ponctuelle · atterrissage',ca.ponctAtt)];
    const caTile=(l,o,ref,chart)=>{if(o.hors)return horsTile(l,o.hors,ref,chart);const m=floor10(o.masse),ok=M<=m;return tile({l,v:(o.sup?'≥ ':'')+fr(m),u:'kg',chart,state:ok?'ok':'ko',status:pill(ok?'ok':'ko',ok?'Marge +'+fr(m-M)+' kg':'Dépassement '+fr(M-m)+' kg'),ref})};
    const a=N.hv;
    const hvAl=[];
    if(!a.hors&&a.inexistant)hvAl.push(['Point A sous 100 ft : zone à éviter inexistante (5.1 §4.1).','in']);
    if(a.nonDemontre)hvAl.push(['Masse supérieure à la masse HES : domaine non démontré. Trajectoires recommandées 5.1 §4.2 ; hors décollage et atterrissage, éviter Vi < 40 kt.','ko']);
    // stationnaire 1 GTM en panne (5.1 fig 10, 11, 12) et délai d'obtention par consommation du carburant
    const conso=num(st.conso),cl=st.lines.find(l=>l.type==='carb'),F0=cl&&num(cl.kg)>0?num(cl.kg):0;
    const hm=mn=>{mn=Math.ceil(mn);return mn<60?mn+' min':Math.floor(mn/60)+' h '+String(mn%60).padStart(2,'0')};
    const mono=(k,l,ref)=>{const r=N[k];if(r.hors)return horsTile(l,r.hors,ref,k);const m=floor10(r.masse),need=M-m;
      let state,status,extra='';
      if(need<=0){state='ok';status=pill('ok','Disponible · marge +'+fr(-need)+' kg')}
      else if(need>F0){state='ko';status=pill('ko','Non atteignable : −'+fr(need)+' kg, '+fr(F0)+' kg de carburant à bord')}
      else if(!(conso>0)){state='wn';status=pill('wn','Brûler '+fr(need)+' kg · saisir la consommation')}
      else{state='wn';status=pill('wn','Dans '+hm(need/conso*60)+' (−'+fr(need)+' kg)');extra=' · carburant restant '+fr(F0-need)+' kg'}
      return tile({l,v:(r.sup?'≥ ':'')+fr(m),u:'kg',big:true,chart:k,state,status,ref:ref+extra})};
    // montée sur 1 GTM (5.1 fig 16) : Vz à Vy au terrain, pente, et niveau de rétablissement où la Vz calculée
    // (pénalités des optionnels déduites) vaut +50 ft/min (procédure exploitant).
    // Corrections des optionnels identiques à l'onglet Entraînement : θs +5 °C (EAP), pénalités de Vz à Vy.
    const dTc=PEN.pannes.dTclimb,penVy=PEN.pannes.vzVyPen,Tc=T+dTc;
    const CIBLE=50; // ft/min, procédure exploitant (en plus des pénalités des optionnels)
    const v16=Fig16.vzVy(Tc,Zp,M),nr=Fig16.niveauRetablissement(T,Zp,M,dTc,penVy,CIBLE);
    // pente sur la trajectoire air : Vz / Vy, Vy = 70 kt (Vp) à 0 ft d'altitude densité − 1 kt / 1000 ft (PMV 1.3)
    const Vy=70-zs,pente=vz=>{const p=vz/(Vy*6076.12/60)*100;return `<b>Pente ${p<0?'−':''}${fr(Math.abs(p),1)} % · ${p<0?'−':''}${fr(Math.abs(vz/Vy*60))} ft/NM</b> à Vy ${fr(Vy,1)} kt (Vp) · `};
    const penTxt=(dTc?' · θs +'+dTc+' °C (EAP)':'')+(penVy?' · −'+penVy+' ft/min (optionnels)':'');
    const vzTile=(()=>{const l='Vz à Vy · 1 GTM en panne',ref='5.1 fig 16 · Zp '+fr(Zp)+' ft · θs '+fr(Tc)+' °C'+penTxt;
      if(v16.dessous)return tile({l,v:'&lt; −500',u:'ft/min',big:true,chart:'vz16',state:'ko',status:pill('ko','Descente : palier impossible'),ref});
      if(v16.dessus)return tile({l,v:'&gt; 1500',u:'ft/min',big:true,chart:'vz16',state:'ok',status:pill('ok','Palier tenu'),ref});
      if(v16.hors)return horsTile(l,v16.hors,'5.1 fig 16','vz16');
      const v=Math.round(v16.vz-penVy),s=v>=CIBLE?'ok':(v>=0?'wn':'ko');
      return tile({l,v:fr(v),u:'ft/min',big:true,chart:'vz16',state:s,status:pill(s,v>=CIBLE?'≥ +'+CIBLE+' ft/min : palier tenu':(v>=0?'Palier tenu de justesse (< +'+CIBLE+' ft/min)':'Descente : palier impossible')),ref:pente(v)+ref})})();
    const nrTile=(()=>{const l='Niveau de rétablissement · +'+CIBLE+' ft/min à Vy',ref='5.1 fig 16 · masse '+fr(M)+' kg · θs terrain −1,98 °C / 1000 ft'+penTxt;
      if(nr.borne==='inf')return tile({l,v:'—',u:'',big:true,chart:'plaf',state:'ko',status:pill('ko','+'+CIBLE+' ft/min jamais atteint sur l’abaque'),ref});
      if(nr.hors)return horsTile(l,nr.hors,'5.1 fig 16','plaf');
      const z=Math.floor(nr.Zp/100)*100,ok=z>=Zp,fl=z>0?' · FL '+String(Math.floor(z/100)).padStart(3,'0'):'';
      return tile({l,v:(nr.borne==='sup'?'≥ ':'')+fr(z),u:'ft',big:true,chart:'plaf',state:ok?'ok':'ko',status:pill(ok?'ok':'ko',(ok?'Zp':'Sous l’altitude terrain')+fl+' · θs '+fr(nr.T,1)+' °C'),ref:ref+(nr.borne==='sup'?' · au-delà : '+esc(nr.limite):'')})})();
    // charge externe : masse HES SUP.15 fig 2 (9350 kg maxi)
    const extTile=EXT?(()=>{const r=N.hesExt,l='HES avec charge externe',ref='SUP.15 fig 2 · masse max déco / atterrissage';
      if(r.hors)return horsTile(l,r.hors,ref,'hesExt');const m=floor10(r.masse),mg=m-M;
      return tile({l,v:(r.sup&&!r.limiteeMmax?'≥ ':'')+fr(m),u:'kg',big:true,chart:'hesExt',state:mg>=0?'ok':'ko',status:pill(mg>=0?'ok':'ko',(mg>=0?'Marge +':'Dépassement ')+fr(Math.abs(mg))+' kg'),ref:ref+(r.limiteeMmax?' · limitée à 9350 kg':'')})})():'';
    R.innerHTML=
      alerts(common.concat(N.warnings.map(w=>[w])))+
      `<div class="sec">Stationnaire avec 1 GTM en panne · régime 2 min 30 s</div>`+
      `<div class="tiles big">${mono('mono10','Mono DES 10 ft','5.1 fig 10')}${mono('mono15','Mono DES 15 ft','5.1 fig 11')}${mono('monoHes','Mono HES','5.1 fig 12')}</div>`+
      `<div class="sec">Montée à Vy avec 1 GTM en panne · régime intermédiaire d’urgence · 5.1 fig 16</div>`+
      `<div class="tiles big">${vzTile}${nrTile}</div>`+
      verdict(rowsA,'Catégorie selon le SUP.1 (masses max fig 1 et fig 2, altitude densité ≤ 8000 ft)','Autres conditions CAT A du SUP.1 à vérifier : décollage et atterrissage vent arrière interdits ; équipage VFR 1 pilote + 1 membre d’équipage, IFR 2 pilotes ; prélèvements P2 coupés ; franchissement d’obstacles (fig 5 à 7) non calculé ici.')+
      (pens.length?`<div class="pens">${pens.map(p=>`<span>${p}</span>`).join('')}</div>`:'')+
      `<div class="sec">Masses maximales en stationnaire · 2 GTM</div>`+
      `<div class="tiles big">${extTile}${bi('des10','BI DES 10 ft','5.1 fig 7 · masse max au décollage')}${bi('des15','BI DES 15 ft','5.1 fig 8')}${bi('hes','BI HES','5.1 fig 9')}</div>`+
      `<div class="sec">Masses maximales CAT A · SUP.1</div><div class="tiles">`+
        caTile('Terrain dégagé déco / att',ca.degage,'SUP.1 fig 1'+(st.opts.eap?' · θs +5 °C':'')+(st.opts.skis?' · −150 kg skis':''),'ca1')+
        caTile('Aire ponctuelle décollage',ca.ponctDeco,'SUP.1 fig 2'+(st.opts.eap?' · −2 %':''),'ca2')+
        caTile('Aire ponctuelle atterrissage',ca.ponctAtt,'SUP.1 fig 1'+(st.opts.eap?' · −2 %':''),'ca3')+
        (()=>{const dc=ca.dec,h=dc.hors.all||dc.hors.V1;if(h)return horsTile('V1 · CAT A',h,'SUP.1 fig 4','cav1');const mini=dc.below||dc.V1brut<30;
          return tile({l:'V1 · CAT A',v:fr(Math.ceil(dc.V1)),u:'kt',chart:'cav1',state:mini?'wn':'',status:mini?pill('wn',dc.below?'Hors réseau θs : mini':'Valeur mini retenue'):pill('na','mini 30 kt'),
            ref:'SUP.1 fig 4 · TcD '+dc.TD+' s · d '+fr(dc.DAA)+' m'+(dc.D1?' · D1 '+fr(dc.D1)+' m':'')+(st.opts.eap?' · θs +5 °C':'')})})()+
        (()=>{const vs=ca.vsd;if(vs.hors)return horsTile('VSD · CAT A',vs.hors,'SUP.1 fig 3','cavsd');const mini=vs.brut<45;
          return tile({l:'VSD · CAT A',v:fr(Math.ceil(vs.vsd)),u:'kt',chart:'cavsd',state:mini?'wn':'',status:mini?pill('wn','Valeur mini retenue'):pill('na','mini 45 kt'),ref:'SUP.1 fig 3'+(st.opts.eap?' · θs +5 °C':'')+(vs.bord?' · lu au bord de l’abaque':'')})})()+
      `</div>`+
      `<div class="sec">Domaine hauteur – vitesse · 5.1 fig 5</div>`+
      (a.hors?`<div class="card">${alerts([['Hors abaque : '+esc(a.hors),'ko']])}</div>`:
      `<div class="card hvcard" data-chart="hv"><div style="display:flex;justify-content:flex-end;margin:-4px 0 4px"><span class="pill" style="background:var(--accent-soft);color:var(--accent)">Abaque ›</span></div><div class="hv"><div>${hvSvg(a.inexistant?0:a.A)}</div><div>
        <div class="kv"><span>Point A · 0 kt</span><b class="num">${a.inexistant?'&lt; 100 ft':fr(a.A)+' ft'}</b>
        <span></span><b class="num" style="font-size:14px;color:var(--muted)">${a.inexistant?'':fr(a.A*0.3048)+' m'}</b>
        <span>Point B</span><b class="num">30 kt · 100 ft</b><span>Point C · 0 kt</span><b class="num">20 ft</b></div>
        ${hvAl.length?'<div style="margin-top:12px">'+alerts(hvAl)+'</div>':''}
        <div class="tr" style="font-size:12px;color:var(--muted);margin-top:8px">Schéma indicatif : seules les valeurs A, B et C font foi.</div></div></div></div>`);
    CTX={T,Zp,M,vent,N,PEN,c16:{v16,nr,Tc,dTc,pen:penVy,cible:CIBLE,Vy}};bindCharts();
    return;
  }

  if(st.tab==='m'){missionCalc({T,Zp,qnh,M,C,PEN,common,R,horsTile,ac});return}

  // ---------- pannes ----------
  const pp=PEN.pannes;
  const P=Carton.cartonStrict({T,Zp,M,vent},pp);
  const H=P.hors;
  const pens=[];
  if(pp.fHover<1)pens.push('−2 % statio / aire ponctuelle (EAP)');
  if(pp.dTclimb)pens.push('Montée θs '+sgn(pp.dTclimb)+' °C');
  if(pp.dTcatA)pens.push('Cat A θs '+sgn(pp.dTcatA)+' °C');
  if(pp.dThover)pens.push('Statio θs '+sgn(pp.dThover)+' °C');
  if(pp.massPen)pens.push('Masse terrain dégagé −'+pp.massPen+' kg');
  if(pp.vz45Pen)pens.push('Vz 45 kt −'+pp.vz45Pen+' ft/min');
  if(pp.vzVyPen)pens.push('Vz Vy −'+pp.vzVyPen+' ft/min');
  const al=common.slice();
  if(st.opts.ddj)al.push(['DDJ coché : incompatible avec l’entraînement aux procédures OEI, sauf tuyères de remplacement (SUP.0).','ko']);
  P.warnings.forEach(w=>al.push([w,/limite SUP\.3/.test(w)?'ko':'']));

  const lim=(key,l,val,ref,maxTxt,chart,sup)=>{if(H[key])return horsTile(l,H[key],ref,chart);const m=floor10(val);const ok=M<=m;return tile({l,v:(sup?'≥ ':'')+fr(m),u:'kg',chart,state:ok?'ok':'ko',status:pill(ok?'ok':'ko',ok?'Marge +'+fr(m-M)+' kg':'Dépassement '+fr(M-m)+' kg'),ref:ref+(maxTxt?' · '+maxTxt:'')})};
  const vzT=(key,l,v,min,ref,chart)=>{if(H[key])return horsTile(l,H[key],ref,chart);const ok=v>=min;return tile({l,v:fr(v),u:'ft/min',chart,state:ok?'ok':'ko',status:pill(ok?'ok':'ko',ok?'≥ '+min+' ft/min':'< '+min+' ft/min'),ref})};
  const dT=(key,l,v,u,mini,minTxt,ref,chart)=>{if(H[key])return horsTile(l,H[key],ref,chart||'dec');return tile({l,v:fr(Math.ceil(v)),u,chart:chart||'dec',state:mini?'wn':'',status:mini?pill('wn',P.reseauMini?'Hors réseau θs : mini':'Valeur mini retenue'):pill('na',minTxt),ref})};
  const pt=(key,l,a,ref,chart)=>{if(H[key])return horsTile(l,H[key],ref,chart);return tile({l,chart,v:a.inexistant?'&lt; 100':fr(a.ft),u:'ft',status:a.inexistant?pill('na','Zone inexistante'):'',ref})};
  const vz100=()=>{if(H.masseVz100)return horsTile('Masse pour Vz 100 ft/min à 45 kt',H.masseVz100,'SUP.3 fig 3','vz100');
    if(P.masseVz100Sup)return tile({l:'Masse pour Vz 100 ft/min à 45 kt',v:'≥ 9 000',u:'kg',chart:'vz100',state:'ok',status:pill('ok','Toutes masses'),ref:'SUP.3 fig 3'});
    return lim('masseVz100','Masse pour Vz 100 ft/min à 45 kt',P.masseVz100,'SUP.3 fig 3','','vz100')};
  const monoT=()=>{if(H.masseMono15ft)return horsTile('Stationnaire DES 15 ft mono',H.masseMono15ft,'SUP.3 fig 2','mono');const mono=floor10(P.masseMono15ft),ok=M<=mono;
    return tile({l:'Stationnaire DES 15 ft mono',v:(P.fig2Sup?'≥ ':'')+fr(mono),u:'kg',chart:'mono',state:ok?'ok':'wn',status:pill(ok?'ok':'wn',ok?'Statio mono possible':'Statio mono impossible'),ref:'SUP.3 fig 2'})};
  // verdict profil CAT A simulé (SUP.3 §2.2 : masses détarées fig 6 et 7)
  const da=P.zsigma<=8;
  const vRow=(l,key,val,sup)=>{if(H[key])return{l,ok:false,why:'hors abaque : '+H[key]};const m=floor10(val);return{l,ok:da&&M<=m,why:'masse '+fr(M)+' kg '+(M<=m?'≤':'>')+' masse max '+(sup?'≥ ':'')+fr(m)+' kg'+(da?'':' · altitude densité > 8000 ft')}};
  const rowsP=[vRow('Terrain dégagé · décollage et atterrissage','masseDegagee',P.masseDegagee,P.fig6Sup),vRow('Aire ponctuelle · décollage','massePonctuelleDeco',P.massePonctuelleDeco,P.fig7Sup),vRow('Aire ponctuelle · atterrissage','massePonctuelleAtt',P.massePonctuelleAtt,P.fig6RSup)];

  R.innerHTML=alerts(al)+
    verdict(rowsP,'Entraînement : profil CAT A simulé selon le SUP.3 (masses détarées fig 6 et 7)','Au-delà de ces masses, la séance ne reproduit plus les performances CAT A du SUP.1 : on est en CAT B.')+
    (pens.length?`<div class="pens">${pens.map(p=>`<span>${p}</span>`).join('')}</div>`:'')+
    `<div class="sec">Masses maxi détarées · masse retenue ${fr(M)} kg</div><div class="tiles">`+
      lim('masseDegagee','Terrain dégagé déco / att',P.masseDegagee,'SUP.3 fig 6','≤ 8600 kg','deg',P.fig6Sup)+
      lim('massePonctuelleDeco','Aire ponctuelle décollage',P.massePonctuelleDeco,'SUP.3 fig 7','≤ 8600 kg','pdeco',P.fig7Sup)+
      lim('massePonctuelleAtt','Aire ponctuelle atterrissage',P.massePonctuelleAtt,'SUP.3 fig 6','≤ 8300 kg','ponct',P.fig6RSup)+
      vz100()+monoT()+
    `</div><div class="sec">Taux de montée sur 1 GTM</div><div class="tiles">`+
      vzT('vz45','Vz à 45 kt',P.vz45,100,'SUP.3 fig 3','vz45')+vzT('vzVy','Vz à Vy',P.vzVy,150,'SUP.3 fig 4','vzvy')+
    `</div><div class="sec">Décollage · masse corrigée ${P.masseCorrigee!==null?fr(P.masseCorrigee)+' kg':'hors abaque'}</div><div class="tiles">`+
      dT('TD','Temps de décision',P.TD,'s',P.TDbrut<4,'mini 4 s · arrondi sup.','SUP.3 fig 8')+
      dT('DAA','Distance accél.-arrêt',P.DAA,'m',P.DAAbrut<150,'mini 150 m','SUP.3 fig 8')+
      dT('V1','V1',P.V1,'kt',P.V1brut<30,'mini 30 kt','SUP.3 fig 8')+
      dT('VSD','VSD',P.VSD,'kt',P.VSDbrut<45,'mini 45 kt','SUP.3 fig 9'+(P.vsdBord?' · lu au bord de l’abaque':''),'vsd')+
      dT('D1','Passage 35 ft (D1)',P.D1,'m',P.D1brut<260,'mini 260 m','SUP.3 fig 8')+
    `</div><div class="sec">Domaine hauteur – vitesse · 5.1 fig 5</div><div class="tiles">`+
      pt('pointA','Point A · θs réelle',P.pointA,'Domaine H-V normal','pa')+
      pt('pointAprime','Point A’ · θs + 25 °C',P.pointAprime,'Entraînement · θs + 25 = '+fr(P.Tplus25)+' °C','pa2')+
    `</div>`;
  CTX={T,Zp,M,vent,P,PEN};bindCharts();
}

// ---------------- mission ----------------
function missionCalc({T,Zp,qnh,M,C,PEN,common,R,horsTile}){
  const mi=st.mis,dist=num(mi.dist),gs=num(mi.gs),conso=num(st.conso),res=isFinite(num(mi.res))?num(mi.res):0;
  const alt2=num(mi.alt),T2=num(mi.temp),qnh2=isFinite(num(mi.qnh))?num(mi.qnh):qnh,bras=mi.elingue?4.86:(isFinite(num(mi.bras))?num(mi.bras):4.70);
  const miss=[];
  if(!(dist>=0))miss.push('distance du trajet');if(!(gs>0))miss.push('vitesse sol');if(!(conso>0))miss.push('consommation horaire (carte Conditions)');
  if(!isFinite(alt2))miss.push('altitude de la zone de poser');if(!isFinite(T2))miss.push('température de la zone de poser');
  if(miss.length){R.innerHTML=alerts(common)+`<div class="card empty"><b style="color:var(--ink)">Il manque :</b><br>${miss.map(esc).join('<br>')}</div>`;CTX=null;return}
  const fuelL=st.lines.find(l=>l.type==='carb'),F0=fuelL&&num(fuelL.kg)>0?num(fuelL.kg):0;
  const tH=dist/gs,trip=tH*conso,F1=F0-trip;
  const Zp2=Carton.zpFromQnh(alt2,qnh2);
  const pen=PEN.normal;
  // charge à l'élingue (bras 4,86 m) : HES avec charge externe SUP.15 fig 2, 9350 kg maxi, charge ≤ 3000 kg
  const ext=!!mi.elingue,FIGM=ext?'sup15':'fig9',MMX=ext?Perf.MMAX_EXT:Perf.MMAX;
  const hes=(TT,ZZ)=>{const s=Perf.masseStatio(FIGM,TT+pen.dThover,ZZ);if(s.hors)return {hors:s.hors,Th:TT+pen.dThover};
    const m=Math.min(s.brut*pen.fHover,MMX);return {brut:s.brut,sup:s.sup&&s.brut*pen.fHover<MMX,masse:floor10(m),lim9:s.brut*pen.fHover>=MMX,Th:TT+pen.dThover}};
  const hd=hes(T,Zp),ha=hes(T2,Zp2);
  const Ma0=M-trip;
  const al=common.slice();
  if(F1<0)al.push(['Carburant insuffisant : le trajet consomme '+fr(trip)+' kg pour '+fr(F0)+' kg à bord.','ko']);
  else if(F1<res)al.push(['Carburant à l’arrivée '+fr(F1)+' kg, inférieur à la réserve demandée ('+fr(res)+' kg).','ko']);
  const pens=[];if(pen.fHover<1)pens.push('Statio −2 % (EAP)');if(pen.dThover)pens.push('Statio θs '+sgn(pen.dThover)+' °C (DDJ)');
  let P=null,lim='',Pa=null,Pd=null;
  if(!hd.hors)Pd=hd.masse-M;if(!ha.hors)Pa=ha.masse-Ma0;
  if(Pd!==null&&Pa!==null){P=Math.min(Pd,Pa);lim=Pd<=Pa?'d':'a'}
  if(ext&&P!==null&&P>3000){P=3000;lim='c'}
  const geP=P!==null&&((lim==='d'&&hd.sup)||(lim==='a'&&ha.sup));
  // centrage avec la charge
  const ail=!!st.opts.sponsons,Pk=P!==null?Math.max(0,floor10(P)):0;
  const mom0=C.Mom+Pk*bras,M1=M+Pk,x1=mom0/M1;
  const momA=C.Mom-CG.momentCarb(F0,ail,[])+CG.momentCarb(Math.max(0,F1),ail,[])+Pk*bras,MA=Ma0+Pk,xA=momA/MA;
  // avec charge externe : appareil sans la charge dans le domaine, ensemble ≤ 9350 kg dans le domaine (prolongé à 4,55 – 4,90 m au-delà de 9000 kg)
  const okExt=(Mt,xt,Ma,xa)=>CG.dansDomaine(Ma,xa)&&Mt<=9350&&xt>=CG.limites(Math.min(Mt,9000)).av-1e-9&&xt<=4.90+1e-9;

      svgs.push(V.decision(P,vent));
      cap=`1/2 : θs ${fr(T)} °C, Zp ${f0(Zp)} ft → Zσ ${f0(P.zsigma*1000)} ft → masse ${f0(M)} kg → <b>masse corrigée ${f0(P.masseCorrigee)} kg</b>. 2/2 : θs ${fr(P.Tcat)} °C, vent ${fr(vent)} kt → TcD ${fr(P.TDbrut,1)} s (retenu <b>${P.TD} s</b>), DAA <b>${f0(P.DAA)} m</b>, D1 ${H.D1?'<b>hors abaque</b>':'<b>'+f0(P.D1)+' m</b>'}, V1 ${H.V1?'<b>hors abaque</b> ('+esc(H.V1)+')':'<b>'+f0(Math.ceil(P.V1))+' kt</b>'}.`;break;
    case 'pa':title='Point A · θs réelle · 5.1 fig 5';if(H.pointA){horsCap(H.pointA,'h5');break}svgs=[V.hv(M,Zp,T,P.pointA.r,P.pointA.brut)];cap=`Hauteur du point A : <b>${P.pointA.inexistant?'< 100 ft':f0(P.pointA.ft)+' ft'}</b>.`;break;
    case 'pa2':title='Point A’ · θs + 25 °C · 5.1 fig 5';if(H.pointAprime){horsCap(H.pointAprime,'h5');break}svgs=[V.hv(M,Zp,T+25,P.pointAprime.r,P.pointAprime.brut)];cap=`Température fictive ${fr(T+25)} °C (SUP.3 §2.3) : <b>${P.pointAprime.inexistant?'< 100 ft':f0(P.pointAprime.ft)+' ft'}</b>.`;break;
    default:return;
  }
  setTitle(title,svgs);
  $('#chartBody').innerHTML=`<p class="chartcap">${cap}</p>`+svgs.map(s=>`<div class="chartbox">${s}</div>`).join('')+`<p class="chartcap" style="font-size:12.5px;color:var(--muted)">Cheminement recalculé avec les valeurs saisies et tracé sur l'abaque du PMV, sans extrapolation. Pinces pour zoomer.</p>`;
  $('#chart').showModal();$('#chartBody').scrollTop=0;
}
$('#closechart').addEventListener('click',()=>$('#chart').close());
$('#chart').addEventListener('click',e=>{if(e.target===$('#chart'))$('#chart').close()});

renderVide();renderLines();renderOpts();calc();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
